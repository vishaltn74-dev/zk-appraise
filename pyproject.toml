[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-appraise"
version = "0.1.0"
description = "ZKML Home Equity Valuation & Midnight Network Collateral Protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "onnx>=1.14.0",
    "ezkl>=0.1.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "pytest>=7.4.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
    "ai-engine",
]
pythonpath = [
    "zk-circuits",
    "zk-circuits/src",
    "ai-engine",
    "."
]
